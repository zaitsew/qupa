<svg xmlns="http://www.w3.org/2000/svg" width="880" height="284" viewBox="0 0 880 284" role="img" aria-label="Highlights. JOIN: Scan, type a name, play. Up to 8 phones join by QR code in the browser. No install. LOCAL: The TV is the server. The game runs on your home network, behind a room code. REMOTE: No phones? Play in teams. Two to four teams take turns with the D-pad and OK. QUESTIONS: 5,272 questions, 24 topics. From the Open Trivia Database, in English for now. SPEED: Faster answers score more. Up to 1,000 points, never less than 500 for a right answer. PRIVATE: No ads, no telemetry. No accounts and no outgoing network calls. UI in EN, ES, RU.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ECEDF2}.m{fill:#A2A7B5}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="283" rx="12" fill="#171A21" stroke="#2B2F3A"/>
<rect x="20.0" y="20" width="272.0" height="116" rx="10" fill="#1D2029"/>
<rect x="38.0" y="39" width="8" height="8" rx="2.5" fill="#A78BFA"/>
<text class="cap b" x="52.0" y="48" font-size="12" style="fill:#A78BFA;letter-spacing:.07em">JOIN</text>
<text class="b" x="38.0" y="74" font-size="16.5">Scan, type a name, play</text>
<text class="m" x="38.0" y="97" font-size="13.5">Up to 8 phones join by QR code in the</text>
<text class="m" x="38.0" y="116" font-size="13.5">browser. No install.</text>
<rect x="304.0" y="20" width="272.0" height="116" rx="10" fill="#1D2029"/>
<rect x="322.0" y="39" width="8" height="8" rx="2.5" fill="#A78BFA"/>
<text class="cap b" x="336.0" y="48" font-size="12" style="fill:#A78BFA;letter-spacing:.07em">LOCAL</text>
<text class="b" x="322.0" y="74" font-size="16.5">The TV is the server</text>
<text class="m" x="322.0" y="97" font-size="13.5">The game runs on your home network,</text>
<text class="m" x="322.0" y="116" font-size="13.5">behind a room code.</text>
<rect x="588.0" y="20" width="272.0" height="116" rx="10" fill="#1D2029"/>
<rect x="606.0" y="39" width="8" height="8" rx="2.5" fill="#A78BFA"/>
<text class="cap b" x="620.0" y="48" font-size="12" style="fill:#A78BFA;letter-spacing:.07em">REMOTE</text>
<text class="b" x="606.0" y="74" font-size="16.5">No phones? Play in teams</text>
<text class="m" x="606.0" y="97" font-size="13.5">Two to four teams take turns with the</text>
<text class="m" x="606.0" y="116" font-size="13.5">D-pad and OK.</text>
<rect x="20.0" y="148" width="272.0" height="116" rx="10" fill="#1D2029"/>
<rect x="38.0" y="167" width="8" height="8" rx="2.5" fill="#A78BFA"/>
<text class="cap b" x="52.0" y="176" font-size="12" style="fill:#A78BFA;letter-spacing:.07em">QUESTIONS</text>
<text class="b" x="38.0" y="202" font-size="16.5">5,272 questions, 24 topics</text>
<text class="m" x="38.0" y="225" font-size="13.5">From the Open Trivia Database, in</text>
<text class="m" x="38.0" y="244" font-size="13.5">English for now.</text>
<rect x="304.0" y="148" width="272.0" height="116" rx="10" fill="#1D2029"/>
<rect x="322.0" y="167" width="8" height="8" rx="2.5" fill="#A78BFA"/>
<text class="cap b" x="336.0" y="176" font-size="12" style="fill:#A78BFA;letter-spacing:.07em">SPEED</text>
<text class="b" x="322.0" y="202" font-size="16.5">Faster answers score more</text>
<text class="m" x="322.0" y="225" font-size="13.5">Up to 1,000 points, never less than</text>
<text class="m" x="322.0" y="244" font-size="13.5">500 for a right answer.</text>
<rect x="588.0" y="148" width="272.0" height="116" rx="10" fill="#1D2029"/>
<rect x="606.0" y="167" width="8" height="8" rx="2.5" fill="#A78BFA"/>
<text class="cap b" x="620.0" y="176" font-size="12" style="fill:#A78BFA;letter-spacing:.07em">PRIVATE</text>
<text class="b" x="606.0" y="202" font-size="16.5">No ads, no telemetry</text>
<text class="m" x="606.0" y="225" font-size="13.5">No accounts and no outgoing network</text>
<text class="m" x="606.0" y="244" font-size="13.5">calls. UI in EN, ES, RU.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="188" viewBox="0 0 880 188" role="img" aria-label="How it works. 1. Open Qupa. Pick Play with phones on the TV. 2. Scan the QR. Phones join over your home Wi-Fi. 3. Pick the rules. Questions, answer time, topics. 4. Buzz in. Answer on your phone; faster scores more. 5. Podium. Winner on screen, then play again.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ECEDF2}.m{fill:#A2A7B5}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="187" rx="12" fill="#171A21" stroke="#2B2F3A"/>
<line x1="90.0" x2="190.0" y1="52" y2="52" stroke="#2B2F3A" stroke-width="2" stroke-linecap="round"/>
<circle cx="60.0" cy="52" r="20" fill="#A78BFA"/>
<text class="b" x="60.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">1</text>
<text class="b" x="40.0" y="98" font-size="15.5">Open Qupa</text>
<text class="m" x="40.0" y="120" font-size="13.5">Pick Play with</text>
<text class="m" x="40.0" y="139" font-size="13.5">phones on the TV.</text>
<line x1="250.0" x2="350.0" y1="52" y2="52" stroke="#2B2F3A" stroke-width="2" stroke-linecap="round"/>
<circle cx="220.0" cy="52" r="20" fill="#A78BFA"/>
<text class="b" x="220.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">2</text>
<text class="b" x="200.0" y="98" font-size="15.5">Scan the QR</text>
<text class="m" x="200.0" y="120" font-size="13.5">Phones join over your</text>
<text class="m" x="200.0" y="139" font-size="13.5">home Wi-Fi.</text>
<line x1="410.0" x2="510.0" y1="52" y2="52" stroke="#2B2F3A" stroke-width="2" stroke-linecap="round"/>
<circle cx="380.0" cy="52" r="20" fill="#A78BFA"/>
<text class="b" x="380.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">3</text>
<text class="b" x="360.0" y="98" font-size="15.5">Pick the rules</text>
<text class="m" x="360.0" y="120" font-size="13.5">Questions, answer</text>
<text class="m" x="360.0" y="139" font-size="13.5">time, topics.</text>
<line x1="570.0" x2="670.0" y1="52" y2="52" stroke="#2B2F3A" stroke-width="2" stroke-linecap="round"/>
<circle cx="540.0" cy="52" r="20" fill="#A78BFA"/>
<text class="b" x="540.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">4</text>
<text class="b" x="520.0" y="98" font-size="15.5">Buzz in</text>
<text class="m" x="520.0" y="120" font-size="13.5">Answer on your</text>
<text class="m" x="520.0" y="139" font-size="13.5">phone; faster scores</text>
<text class="m" x="520.0" y="158" font-size="13.5">more.</text>
<circle cx="700.0" cy="52" r="20" fill="#A78BFA"/>
<text class="b" x="700.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">5</text>
<text class="b" x="680.0" y="98" font-size="15.5">Podium</text>
<text class="m" x="680.0" y="120" font-size="13.5">Winner on screen,</text>
<text class="m" x="680.0" y="139" font-size="13.5">then play again.</text>
</svg>
